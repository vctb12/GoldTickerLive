name: Generate sitemap

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Generate sitemap without committing changes'
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
  push:
    branches: [main]
  schedule:
    # Daily at 00:00 UTC to refresh sitemap lastmod dates.
    - cron: '0 0 * * *'

permissions:
  contents: write

jobs:
  sitemap:
    runs-on: ubuntu-latest
    # Avoid overlapping commits when cron aligns with other main pushes.
    concurrency:
      group: generate-sitemap
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '24'
      - name: Configure git push retry helper
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/git-push-with-retry" <<'BASH'
          #!/usr/bin/env bash
          set -euo pipefail

          TARGET_BRANCH="${GITHUB_REF_NAME:-main}"
          retry=0
          delay=4
          while true; do
            if git push "$@"; then
              exit 0
            fi

            retry=$((retry + 1))
            if [ "$retry" -gt 4 ]; then
              echo "git push failed after $retry attempts."
              exit 1
            fi

            echo "git push rejected; syncing with origin/${TARGET_BRANCH} before retry ${retry}/4."
            git fetch origin "$TARGET_BRANCH"
            if ! git rebase --autostash "origin/${TARGET_BRANCH}"; then
              echo "git rebase --autostash onto origin/${TARGET_BRANCH} failed; aborting."
              git rebase --abort || true
              exit 1
            fi

            echo "retrying push in ${delay}s."
            sleep "$delay"
            delay=$((delay * 2))
          done
          BASH
          chmod +x "$RUNNER_TEMP/git-push-with-retry"
      - run: node scripts/generate-sitemap.js
      - if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' }}
        run: git status --short public/sitemap.xml && git diff -- public/sitemap.xml
      - if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Actions"
          git add -f public/sitemap.xml
          if git diff --staged --quiet; then
            echo "Sitemap unchanged; nothing to push."
            exit 0
          fi
          git commit -m "chore: regenerate sitemap"
          "$RUNNER_TEMP/git-push-with-retry"
