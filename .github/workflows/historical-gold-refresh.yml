# ------------------------------------------------------------------
# Historical gold daily refresh — homepage UAE chart data only.
# Does NOT modify production live-price fetch (gold-price-fetch.yml).
# Tier: data refresh (dedicated)
# ------------------------------------------------------------------
name: Historical Gold Refresh

on:
  schedule:
    # Daily ~02:45 UTC (within owner-approved 02:15–03:15 window)
    - cron: '45 2 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/node/fetch-gold-api-history.mjs'
      - 'src/lib/gold-api-daily-history-contract.js'
      - 'tests/fetch-gold-api-history.test.js'
      - 'tests/fixtures/gold-api-history/**'
      - '.github/workflows/historical-gold-refresh.yml'

permissions:
  contents: write

concurrency:
  group: historical-gold-refresh
  cancel-in-progress: true

jobs:
  refresh:
    name: Refresh XAU/USD daily history
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify API key is configured
        env:
          GOLD_API_KEY: ${{ secrets.GOLD_API_KEY }}
          GOLD_API_COM_KEY: ${{ secrets.GOLD_API_COM_KEY }}
        run: |
          if [ -z "$GOLD_API_KEY" ] && [ -z "$GOLD_API_COM_KEY" ]; then
            echo "::error::Missing repository secret GOLD_API_KEY (or legacy GOLD_API_COM_KEY)."
            exit 1
          fi
          echo "API key present (name not logged)."

      - name: Fetch daily history
        id: fetch
        env:
          GOLD_API_KEY: ${{ secrets.GOLD_API_KEY }}
          GOLD_API_COM_KEY: ${{ secrets.GOLD_API_COM_KEY }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ] && [ -z "$GOLD_API_KEY" ] && [ -z "$GOLD_API_COM_KEY" ]; then
            echo "PR validation without secret — using fixture."
            node scripts/node/fetch-gold-api-history.mjs \
              --fixture tests/fixtures/gold-api-history/provider-response.json \
              --reference-date "$(date -u +%F)"
          else
            node scripts/node/fetch-gold-api-history.mjs --reference-date "$(date -u +%F)"
          fi

      - name: Run historical data tests
        run: node --test --test-concurrency=1 tests/fetch-gold-api-history.test.js tests/uae-historical-source.test.js

      - name: Coverage summary
        run: node scripts/node/fetch-gold-api-history.mjs --check

      - name: Commit updated dataset
        if: github.event_name != 'pull_request'
        run: |
          if git diff --quiet -- data/historical/xau-usd-daily.json; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/historical/xau-usd-daily.json
          git commit -m "chore(data): refresh XAU/USD daily history [bot]"
          git push

      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@ea165ad8cfe1f4f6c6e2e3b8a4bdb499f2a88b07 # v4
        with:
          name: xau-usd-daily-audit
          path: data/historical/xau-usd-daily.json
          if-no-files-found: ignore
