name: Repair package lock

on:
  push:
    branches:
      - cursor/home-uae-historical-karat-chart-6a31

permissions:
  contents: write

jobs:
  repair-package-lock:
    if: >
      github.actor != 'github-actions[bot]' &&
      !contains(github.event.head_commit.message, '[skip lock repair]')

    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: cursor/home-uae-historical-karat-chart-6a31

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Regenerate package lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify clean installation
        run: npm ci --ignore-scripts

      - name: Commit repaired package lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add package-lock.json

          if git diff --cached --quiet; then
            echo "package-lock.json already synchronized"
            exit 0
          fi

          git commit -m "fix(ci): regenerate package lock [skip lock repair]"
          git push
