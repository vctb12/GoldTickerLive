name: Production Pricing Health

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: production-pricing-health
  cancel-in-progress: true

jobs:
  check:
    name: Check Pages, snapshot, and browser-live provider
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24

      - name: Run production pricing health check
        id: health
        continue-on-error: true
        run: node scripts/node/production-health-check.js --output "$RUNNER_TEMP/gold-health.json"

      - name: Upload sanitized health report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: production-pricing-health
          path: ${{ runner.temp }}/gold-health.json
          retention-days: 14

      - name: Deduplicate P0 issue and close on recovery
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          HEALTH_REPORT: ${{ runner.temp }}/gold-health.json
        run: node scripts/node/sync-production-health-issue.js
