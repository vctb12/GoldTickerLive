# ------------------------------------------------------------------
# Gold Price Fetch — pulls live gold/AED rates from the provider-adapter
# every 5 minutes while global gold markets are open and commits the
# current quote plus bounded DataCore history/provider-health artifacts
# if they changed. This is the single production
# provider-call path; post_gold.yml reads the cached result and does not
# fetch again.
# Triggered by schedule and workflow_dispatch (not push).
# NOT a required merge gate.
# ------------------------------------------------------------------
name: Gold Price Fetch (provider-adapter)

on:
  schedule:
    # Market hours: Sunday 21:00 UTC (Monday 01:00 UAE/GMT+4) through Friday 20:59 UTC.
    # Runs throughout the open market window so the committed snapshot is not
    # allowed to age for an hour between provider attempts.
    - cron: '*/5 21-23 * * 0'  # Sunday 21:00–23:55 UTC (market open window)
    - cron: '*/5 * * * 1-4'    # Monday–Thursday all hours (24/5 market open)
    - cron: '*/5 0-20 * * 5'   # Friday 00:00–20:55 UTC (until market close)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gold-price-fetch
  cancel-in-progress: true

jobs:
  fetch:
    name: Fetch provider consensus → verified gold history
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/python/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/python/requirements.txt

      - name: Fetch gold price
        id: fetch_gold
        env:
          GOLD_API_COM_ENABLED: 'true'
          GOLD_PROVIDER_ORDER: gold_api_com,goldapi_io,twelvedata_xauusd,fmp_gcusd,goldpricez,finnhub_oanda,metal_sentinel,metals_dev,metalpriceapi_xau,metals_api_xau,alpha_vantage_gold
          GOLD_API_COM_KEY: ${{ secrets.GOLD_API_COM_KEY }}
          GOLDAPI_IO_ENABLED: 'true'
          GOLDAPI_IO_KEY: ${{ secrets.GOLDAPI_IO_KEY }}
          GOLDPRICEZ_ENABLED: 'true'
          GOLDPRICEZ_API_KEY: ${{ secrets.GOLDPRICEZ_API_KEY }}
          FINNHUB_ENABLED: 'true'
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FINNHUB_SYMBOL: OANDA:XAU_USD
          METAL_SENTINEL_ENABLED: 'true'
          METAL_SENTINEL_API_KEY: ${{ secrets.METAL_SENTINEL_API_KEY }}
          METAL_SENTINEL_API_HOST: ${{ secrets.METAL_SENTINEL_API_HOST }}
          METAL_SENTINEL_ENDPOINT: ${{ secrets.METAL_SENTINEL_ENDPOINT }}
          METALS_DEV_ENABLED: 'true'
          METALS_DEV_API_KEY: ${{ secrets.METALS_DEV_API_KEY }}
          METALPRICEAPI_ENABLED: 'true'
          METALPRICEAPI_API_KEY: ${{ secrets.METALPRICEAPI_API_KEY }}
          METALS_API_ENABLED: 'true'
          METALS_API_ACCESS_KEY: ${{ secrets.METALS_API_ACCESS_KEY }}
          ALPHA_VANTAGE_ENABLED: 'true'
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          TWELVEDATA_SYMBOL: ${{ secrets.TWELVEDATA_SYMBOL }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          FMP_SYMBOL: ${{ secrets.FMP_SYMBOL }}
          MAX_GOLD_FRESHNESS_SECONDS: '900'
          CONSENSUS_MAX_DEVIATION_PCT: '3'
          MAX_PRICE_JUMP_PCT: '12'
        run: python scripts/python/fetch_gold_consensus.py

      - name: Sync DataCore observation and build static history
        id: snapshot_sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Owner-controlled staged gate. Start observe-only; later modes are enabled only after
          # migration/RLS proof and a measured continuity window. Supported values:
          # observe-only, warn, block-history-write, block-public-export.
          DATACORE_ENFORCEMENT_MODE: ${{ vars.DATACORE_ENFORCEMENT_MODE || 'observe-only' }}
          PRICE_PROVIDER_CHAIN: ${{ steps.fetch_gold.outputs.reason }}
          PRICE_CIRCUIT_STATE: ${{ steps.fetch_gold.outputs.fresh == 'true' && 'closed' || 'fallback' }}
        run: node scripts/node/sync-price-snapshot.js

      - name: Workflow summary
        if: always()
        run: |
          {
            echo "## Gold Price Fetch Summary"
            echo ""
            echo "- Fresh quote: \`${{ steps.fetch_gold.outputs.fresh || 'unknown' }}\`"
            echo "- Selected provider: \`${{ steps.fetch_gold.outputs.provider || 'n/a' }}\`"
            echo "- Provider decision chain: \`${{ steps.fetch_gold.outputs.reason || 'n/a' }}\`"
            echo "- Snapshot synced: \`${{ steps.snapshot_sync.outputs.snapshot_synced || 'false' }}\`"
            echo "- Snapshot sync reason: \`${{ steps.snapshot_sync.outputs.snapshot_sync_reason || 'not_available' }}\`"
            echo "- Snapshot duplicate: \`${{ steps.snapshot_sync.outputs.snapshot_duplicate || 'false' }}\`"
            echo "- DataCore schema state: \`${{ steps.snapshot_sync.outputs.datacore_schema_state || 'not_checked' }}\`"
            echo "- DataCore enforcement: \`${{ steps.snapshot_sync.outputs.datacore_enforcement_mode || 'observe-only' }}\`"
            echo "- DataCore quality gate: \`${{ steps.snapshot_sync.outputs.datacore_gate_status || 'not_checked' }}\`"
            echo "- Gate failures: \`${{ steps.snapshot_sync.outputs.datacore_gate_failures || 'none' }}\`"
            echo "- Gate warnings: \`${{ steps.snapshot_sync.outputs.datacore_gate_warnings || 'none' }}\`"
            echo "- Observation rows: \`${{ steps.snapshot_sync.outputs.observation_rows || '0' }}\`"
            echo "- Observations inserted: \`${{ steps.snapshot_sync.outputs.observation_inserted || '0' }}\`"
            echo "- Observation duplicates: \`${{ steps.snapshot_sync.outputs.observation_duplicates || '0' }}\`"
            echo "- Provider run rows: \`${{ steps.snapshot_sync.outputs.provider_run_rows || '0' }}\`"
            echo "- Provider health rows: \`${{ steps.snapshot_sync.outputs.provider_health_rows || '0' }}\`"
            echo "- Static export updated: \`${{ steps.snapshot_sync.outputs.static_export_updated || 'false' }}\`"
            echo "- Static observations: \`${{ steps.snapshot_sync.outputs.static_observation_count || '0' }}\`"
            echo "- Static missing-slot rate: \`${{ steps.snapshot_sync.outputs.static_missing_slot_rate || 'n/a' }}\`"
            echo "- Static maximum gap seconds: \`${{ steps.snapshot_sync.outputs.static_max_gap_seconds || '0' }}\`"
            echo "- History write blocked: \`${{ steps.snapshot_sync.outputs.history_write_blocked || 'false' }}\`"
            echo "- Public export blocked: \`${{ steps.snapshot_sync.outputs.public_export_blocked || 'false' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit price and bounded DataCore fallback if changed
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          price_snapshot="$(mktemp)"
          datacore_snapshot="$(mktemp)"
          cleanup() {
            rm -f "$price_snapshot" "$datacore_snapshot"
          }
          trap cleanup EXIT
          cp data/gold_price.json "$price_snapshot"
          tar -cf "$datacore_snapshot" data/history data/provider-health

          for attempt in 1 2 3 4; do
            # Other scheduled state writers can advance the branch while this
            # job fetches providers; reset first so the data commit fast-forwards.
            git fetch origin "$TARGET_BRANCH"
            git reset --hard "origin/$TARGET_BRANCH"
            cp "$price_snapshot" data/gold_price.json
            tar -xf "$datacore_snapshot"
            git add data/gold_price.json data/history data/provider-health

            if git diff --cached --quiet; then
              echo "Price and DataCore outputs unchanged; skipping commit."
              exit 0
            fi

            git commit -m 'chore(data): update gold price and history'
            if git push origin "HEAD:$TARGET_BRANCH"; then
              exit 0
            fi

            if [ "$attempt" -eq 4 ]; then
              echo "ERROR: failed to push gold price and DataCore outputs after 4 attempts."
              exit 1
            fi

            sleep_for=$((4 * 2 ** (attempt - 1)))
            echo "Push failed; retrying after ${sleep_for}s."
            sleep "$sleep_for"
          done
