services:
  - type: web
    name: goldtickerlive-api
    runtime: node
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    autoDeployTrigger: checksPass
    healthCheckPath: /api/v1/health
    maxShutdownDelaySeconds: 30
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: SITE_URL
        value: https://goldtickerlive.com
      - key: CORS_ORIGINS
        value: https://goldtickerlive.com,https://www.goldtickerlive.com
      - key: STORAGE_BACKEND
        value: file
      - key: NEWSLETTER_DRY_RUN
        value: true
      - key: ALERT_EMAIL_DRY_RUN
        value: true
      - key: ALERTS_EXPOSE_DEV_TOKENS
        value: false
      - key: REALTIME_PROVIDER_ORDER
        value: gold_api_com,goldapi_io,twelvedata_xauusd,fmp_gcusd,minted_metal
      - key: REALTIME_POLL_MS
        value: 5000
      - key: REALTIME_PROVIDER_TIMEOUT_MS
        value: 1800
